<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>The year ahead · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .timeline { position: relative; }
  .timeline::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--violet-tint); }
  .timeline ol { position: relative; display: flex; flex-direction: column; gap: 14px; }
  .timeline li { display: flex; gap: 12px; align-items: flex-start; }
  .marker { width: 25px; height: 25px; border-radius: 50%; flex-shrink: 0; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
  .marker--done { background: var(--ink); }
  .marker--now { background: var(--accent); border: 3px solid var(--ink); }
  .marker--later { background: var(--surface); border: 3px solid var(--violet); }
  .stage { flex: 1; min-width: 0; background: var(--surface); border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: flex-start; }
  .stage--now { background: var(--accent); border: 2.5px solid var(--ink); flex-direction: column; gap: 10px; }
  .stage--later { border: 1.5px dashed var(--violet); }
  .thumb { width: 96px; height: 64px; border-radius: 8px; overflow: hidden; flex-shrink: 0; line-height: 0; }
  .thumb svg { width: 100%; height: 100%; display: block; }
  .stage--now .thumb { border: 1.5px solid var(--ink); }
  .stage--later .thumb { opacity: 0.75; }
  .stage-when { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .stage-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
  .stage-text { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  .stage--now .stage-when, .stage--now .stage-text { color: var(--ink); }
  .stage--now .stage-when, .stage--now .stage-name { font-weight: 800; }
  .progress { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .progress div { height: 8px; border-radius: 4px; background: var(--surface); }
  .progress .on { background: var(--ink); }
  .rules li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
  .rules .bullet { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header app-header--back">
    <a class="icon-btn" href="town.html" aria-label="Back to town">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="stack stack-1">
      <h1 class="page-title page-title--md">The year ahead</h1>
      <span class="subtitle" id="subtitle">&nbsp;</span>
    </div>
  </header>

  <main class="app-main" id="main" style="gap: 18px; padding-bottom: 28px"><p class="note">Loading…</p></main>
</div>
<script src="js/app.js"></script>
<script type="module">
  import { boot, showError } from './js/ui.js';
  import { renderScene, BUILDINGS } from './js/town.js';
  import { esc } from './js/util.js';

  const main = document.getElementById('main');
  const check = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="a-stroke" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
  const thumb = (pieces) => renderScene({ pieces, extras: 0, lights: 0, people: [], visitors: 0 }, { labels: false, viewBox: '0 20 350 233' });

  try {
    const { group, town } = await boot();
    const p = town.progress;
    const pieces = town.state.pieces;
    document.getElementById('subtitle').textContent = `${group.town_name} · Week ${town.current.number}${town.current.number <= 52 ? ' of 52' : ''}`;

    main.innerHTML = `
      <p class="body-text" style="color: var(--ink-2)">Every building goes up one small piece at a time. Each week your group meets its goal, the next piece goes up. Here's how ${esc(group.town_name)} grows if you meet it every week.</p>

      <div class="timeline">
        <ol>
          ${BUILDINGS.map((b, i) => {
            const end = b.offset + b.stages.length;
            const weeks = `Weeks ${b.offset + 1} – ${end}`;
            if (i < p.index || p.done) return `
              <li>
                <div class="marker marker--done" aria-hidden="true">${check}</div>
                <div class="stage">
                  <div class="thumb">${thumb(end)}</div>
                  <div class="stack" style="gap: 3px">
                    <span class="stage-when">Built</span>
                    <h2 class="stage-name">${esc(b.name)}</h2>
                    <p class="stage-text">${esc(b.blurb)}</p>
                  </div>
                </div>
              </li>`;
            if (i === p.index) return `
              <li>
                <div class="marker marker--now" aria-hidden="true"></div>
                <div class="stage stage--now">
                  <div class="row" style="align-items: flex-start">
                    <div class="thumb">${thumb(pieces)}</div>
                    <div class="stack" style="gap: 3px">
                      <span class="stage-when">${weeks} · You are here</span>
                      <h2 class="stage-name">${esc(b.name)}</h2>
                      <p class="stage-text">${p.built ? `${p.built} of ${p.total} pieces built. ${esc(b.stages[p.built])} is next.` : esc(b.blurb)}</p>
                    </div>
                  </div>
                  <div class="progress" style="grid-template-columns: repeat(${p.total}, minmax(0, 1fr))" role="img" aria-label="${esc(b.name)}: ${p.built} of ${p.total} pieces built">
                    ${b.stages.map((_, s) => `<div${s < p.built ? ' class="on"' : ''}></div>`).join('')}
                  </div>
                </div>
              </li>`;
            return `
              <li>
                <div class="marker marker--later" aria-hidden="true"></div>
                <div class="stage stage--later">
                  <div class="thumb">${thumb(end)}</div>
                  <div class="stack" style="gap: 3px">
                    <span class="stage-when">${weeks}</span>
                    <h2 class="stage-name">${esc(b.name)}</h2>
                    <p class="stage-text">${esc(b.blurb)}</p>
                  </div>
                </div>
              </li>`;
          }).join('')}
        </ol>
      </div>

      <section class="ink-card ink-card--lg" aria-label="How the town grows">
        <h2 class="form-title">How the town grows</h2>
        <ul class="rules stack stack-10">
          <li><span class="bullet bg-coral" aria-hidden="true"></span>Each week at least two-thirds of the group shares a thank-you, the next piece of the current building goes up on Sunday night.</li>
          <li><span class="bullet bg-accent" aria-hidden="true"></span>Stopping by on 3 or more days in a week lights a streetlight.</li>
          <li><span class="bullet bg-pink" aria-hidden="true"></span>Everyone in the group lives in town. The more thank-yous you share and receive, the busier your townsperson is.</li>
          <li><span class="bullet bg-sky" aria-hidden="true"></span>Thank-yous to people outside the group bring visitors passing through.</li>
          <li><span class="bullet bg-mint" aria-hidden="true"></span>Quiet weeks still add something small, like a tree or a flower bed. The town never goes backward.</li>
        </ul>
      </section>`;
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
