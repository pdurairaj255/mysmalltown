<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Your town · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .ladder { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
  .ladder li { border-radius: 6px; padding: 4px 7px; }
  .ladder li.sep { padding: 0; color: var(--muted); }
  .pieces { display: grid; gap: 4px; }
  .pieces li { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; min-width: 0; }
  .pieces .bar { height: 10px; border-radius: 5px; background: var(--coral); }
  .pieces .bar--next { background: transparent; border: 2px dashed var(--coral); }
  .pieces .bar--later { background: var(--line); }
  .milestones { display: flex; flex-wrap: wrap; gap: 8px; }
  .milestones li { display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600; }
  .milestones .done { background: var(--ink); color: var(--on-ink); }
  .milestones .now { background: var(--coral); border: 2px solid var(--ink); font-weight: 700; }
  .milestones .later { background: var(--surface); border: 1.5px dashed var(--violet); color: var(--muted); }
  .news-text { font-size: 14px; line-height: 1.4; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="eyebrow" id="eyebrow">&nbsp;</span>
    <div class="row" style="justify-content: space-between">
      <h1 class="page-title grow" id="title">Your town</h1>
      <button type="button" class="pill-btn" id="rename" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Rename town</button>
    </div>
  </header>

  <main class="app-main app-main--tight" id="main"><p class="note">Loading…</p></main>

  <nav class="tabbar" data-current="town"></nav>
</div>

<dialog class="sheet" id="rename-sheet" aria-labelledby="rename-title">
  <form method="dialog" id="rename-form">
    <h2 class="form-title" id="rename-title">Rename your town</h2>
    <div class="field">
      <label for="town-name" style="font-size: 15px; font-weight: 700">Town name</label>
      <input class="input input--sm" id="town-name" type="text" maxlength="40" autocomplete="off" required>
    </div>
    <fieldset class="field" style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px">Town color</legend>
      <div class="swatches" id="accents"></div>
    </fieldset>
    <p class="form-error" role="alert" hidden></p>
    <div class="row" style="gap: 10px">
      <button type="button" class="btn btn--md btn--outline" id="rename-cancel">Cancel</button>
      <button type="submit" class="btn btn--md" value="save">Save</button>
    </div>
  </form>
</dialog>

<script src="js/app.js"></script>
<script type="module">
  import { boot, api, avatar, ACCENTS, showError, toast } from './js/ui.js';
  import { renderScene, describeScene, BUILDINGS, STATUS, statusFor, statusText } from './js/town.js';
  import { surpriseTitle } from './js/surprises.js';
  import { esc, relativeDay, addDays, listNames } from './js/util.js';

  const main = document.getElementById('main');
  const check = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="a-stroke" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
  const NEWS_ICON = {
    build: ['bg-coral', '<path d="M4 21V10l8-6 8 6v11M4 21h16M10 21v-6h4v6"/>'],
    extra: ['bg-mint-tint', '<circle cx="12" cy="9" r="6"/><path d="M12 15v6"/>'],
    visitor: ['bg-mint', '<circle cx="12" cy="6" r="3"/><path d="M12 9v7M8 21l4-5 4 5M7 13h10"/>'],
    start: ['bg-sky', '<path d="M3 10h18M5 10v10h14V10M3 10l2-5h14l2 5M10 20v-5h4v5"/>']
  };

  try {
    const { group, town, data, me, today } = await boot();
    const week = town.current;
    const p = town.progress;
    document.getElementById('eyebrow').textContent = `${group.name} · Week ${week.number}`;
    document.getElementById('title').textContent = group.town_name;
    document.getElementById('rename').hidden = false;

    const people = data.members.map((m) => ({ ...m, status: statusFor(m.user_id, week) }));
    const order = ['leading', 'helping', 'out', 'home'];
    people.sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));

    const myDays = new Set(week.visitDays.get(me.user_id) || []);
    const mySurprise = week.surprises.find((x) => x.user_id === me.user_id);
    const othersBrought = week.surprises.filter((x) => x.user_id !== me.user_id).map((x) => data.members.find((m) => m.user_id === x.user_id)).filter(Boolean);
    const left = Math.max(0, week.goal - week.sharers.size);

    const stageBars = p.done ? '' : `
      <ol class="pieces" style="grid-template-columns: repeat(${p.total}, minmax(0, 1fr))" aria-label="${esc(p.building.name)}: ${p.built} of ${p.total} pieces built">
        ${p.building.stages.map((s, i) => `<li${i === p.built ? ' style="font-weight: 800"' : i > p.built ? ' style="color: var(--muted)"' : ''}>
          <div class="bar${i === p.built ? ' bar--next' : i > p.built ? ' bar--later' : ''}"></div>${p.total <= 5 ? esc(s) : ''}</li>`).join('')}
      </ol>
      ${p.total > 5 ? `<span class="note">Piece ${p.built + 1} of ${p.total} is next: ${esc(p.building.stages[p.built].toLowerCase())}</span>` : ''}`;

    main.innerHTML = `
      <div class="scene">${renderScene(town.state, { title: describeScene(group.town_name, town.state) })}</div>

      <section class="card" aria-label="Your townspeople">
        <div class="stack stack-4">
          <h2 class="section-title">Your townspeople</h2>
          <p class="note">Everyone in the group lives here. The more notes of appreciation someone shares and receives, the busier they are in town.</p>
        </div>
        <ul class="stack">
          ${people.map((m) => `
            <li class="list-row list-row--center">${avatar(m)}
              <div class="stack stack-1 grow"><span class="item-title">${esc(m.name)}${m.user_id === me.user_id ? ' (you)' : ''}</span><span class="item-sub">${esc(statusText(m.status, p.building.name))}</span></div>
              <span class="tag" style="background: ${STATUS[m.status].bg}">${STATUS[m.status].label}</span>
            </li>`).join('')}
        </ul>
        <div class="inset">
          <span class="eyebrow" style="letter-spacing: 0.06em">From a quiet week to a busy one</span>
          <ol class="ladder">
            <li class="bg-line">At home</li><li class="sep" aria-hidden="true">›</li>
            <li class="bg-sky-tint">Out and about</li><li class="sep" aria-hidden="true">›</li>
            <li class="bg-mint-tint">Helping</li><li class="sep" aria-hidden="true">›</li>
            <li class="bg-accent">Leading</li>
          </ol>
          <span class="item-sub" style="line-height: 1.45">Visiting gets you out and about. Sharing a note of appreciation puts you to work, and sharing and receiving several puts you in charge of a build. A new week starts everyone fresh.</span>
        </div>
      </section>

      <section class="card" aria-label="Building now">
        ${p.done ? `
          <span class="eyebrow">Your town is complete</span>
          <h2 style="font-family: var(--font-display); font-size: 21px; font-weight: 800">Every building is finished</h2>
          <p class="item-sub">Keep sharing notes of appreciation to keep your townspeople busy, and keep visiting for more surprises.</p>` : `
          <div class="row" style="justify-content: space-between; align-items: baseline">
            <span class="eyebrow">Building now</span>
            <span class="tag tag--status ${week.goalMet ? 'bg-mint-tint' : 'bg-sun-tint'}">${week.goalMet ? 'On track' : `${left} more needed`}</span>
          </div>
          <h2 style="font-family: var(--font-display); font-size: 21px; font-weight: 800">The ${esc(p.building.name.toLowerCase())}</h2>
          ${stageBars}`}
        <div class="inset" style="gap: 4px">
          <div class="row" style="justify-content: space-between; align-items: baseline; gap: 10px">
            <span style="font-size: 14px; font-weight: 700">This week's goal</span>
            <span style="font-size: 13px; font-weight: 800; color: ${week.goalMet ? '#1E7A55' : 'var(--muted)'}">${week.goalMet ? 'Met' : 'Not yet'}</span>
          </div>
          <span class="item-sub" style="font-size: 14px; line-height: 1.45">${week.goal} of ${week.members.length} ${week.members.length === 1 ? 'person shares' : 'people share'} a note of appreciation by Sunday. ${week.sharers.size} ${week.sharers.size === 1 ? 'has' : 'have'} so far${week.goalMet ? ', so the next piece goes up Sunday night.' : '.'}</span>
        </div>
      </section>

      <section class="ink-card" aria-label="Visit surprises">
        <div class="row">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="13" width="22" height="16" rx="2" class="a-fill" stroke="#F3F0FF" stroke-width="1.5"/><rect x="3" y="9" width="26" height="6" rx="2" class="a-fill" stroke="#F3F0FF" stroke-width="1.5"/><rect x="14.5" y="9" width="3" height="20" fill="#F3F0FF"/><path d="M16 9 C11 2 6 6 11 9 M16 9 C21 2 26 6 21 9" fill="none" stroke="#F3F0FF" stroke-width="1.6"/></svg>
          <div class="stack stack-2">
            <h2 class="form-title">Visits bring surprises</h2>
            <span class="muted" style="font-size: 13px; line-height: 1.4">Stop by on 3 or more days in a week and something new arrives in town. What it is? That's the surprise.</span>
          </div>
        </div>
        <div class="inset">
          <div class="row" style="justify-content: space-between; gap: 10px">
            <span style="font-size: 14px; font-weight: 700">Your visits this week</span>
            <span class="tag tag--status ${mySurprise ? 'tag--accent' : ''}" style="${mySurprise ? '' : 'background: var(--ink-ring); color: var(--on-ink)'}">${mySurprise ? 'Surprise unlocked!' : `${3 - myDays.size} more to go`}</span>
          </div>
          <div class="week-dots" role="img" aria-label="Visited on ${myDays.size} day${myDays.size === 1 ? '' : 's'} this week">
            ${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => `<div><div class="dot${myDays.has(addDays(week.start, i)) ? ' dot--on' : ''}"></div><span>${d}</span></div>`).join('')}
          </div>
          ${mySurprise ? `<span style="font-size: 14px; font-weight: 700">${esc(surpriseTitle(mySurprise))}</span>` : ''}
        </div>
        ${town.state.spotless ? `<p class="muted" style="font-size: 13px; line-height: 1.4; margin: 0">Spotless week! The town is sparkling after last Sunday's trash clean-up.</p>` : ''}
        <div class="row" style="gap: 10px">
          ${othersBrought.length ? `<div class="avatar-stack">${othersBrought.slice(0, 4).map((m) => avatar(m, 'avatar--30')).join('')}</div>` : ''}
          <span class="muted" style="font-size: 13px; line-height: 1.4">${othersBrought.length ? `${esc(listNames(othersBrought.map((m) => m.name)))} brought a surprise this week too.` : 'No one else has unlocked a surprise this week yet.'}</span>
        </div>
      </section>

      <section class="stack stack-10" aria-label="Built so far">
        <h2 class="section-title">Built so far</h2>
        <ol class="milestones">
          ${BUILDINGS.slice(0, p.done ? BUILDINGS.length : p.index).map((b) => `<li class="done">${check}${esc(b.name)}</li>`).join('')}
          ${p.done ? '' : `<li class="now">${esc(p.building.name)}</li><li class="later" aria-label="More to come, still a surprise">?</li>`}
        </ol>
      </section>

      <section class="stack stack-10" aria-label="Town news">
        <h2 class="section-title">Town news</h2>
        <div class="card card--list" style="padding: 4px 16px">
          ${town.news.slice(0, 8).map((n) => {
            let icon;
            if (n.member) icon = avatar(n.member, 'avatar--32');
            else if (n.kind === 'light') icon = '<div class="icon-tile bg-ink" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="round"><path d="M12 22V11"/><circle cx="12" cy="7" r="4" fill="#FFD23F"/></svg></div>';
            else {
              const [bg, path] = NEWS_ICON[n.kind] || NEWS_ICON.start;
              icon = `<div class="icon-tile ${bg}" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></div>`;
            }
            return `<div class="list-row">${icon}<div class="stack stack-2"><span class="news-text">${esc(n.text)}</span><span class="meta">${relativeDay(n.day, today)}</span></div></div>`;
          }).join('')}
        </div>
      </section>`;

    // Rename town
    const sheet = document.getElementById('rename-sheet');
    const form = document.getElementById('rename-form');
    const nameInput = document.getElementById('town-name');
    document.getElementById('accents').innerHTML = ACCENTS.map((a) => `
      <label class="swatch"><input type="radio" name="accent" value="${a.hex}"${a.hex === group.accent ? ' checked' : ''}><span style="background: ${a.hex}"></span><span class="sr-only">${a.name}</span></label>`).join('');
    document.getElementById('rename').addEventListener('click', () => {
      nameInput.value = group.town_name;
      sheet.showModal();
    });
    document.getElementById('rename-cancel').addEventListener('click', () => sheet.close());
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const town_name = nameInput.value.trim();
      const accent = form.querySelector('input[name=accent]:checked')?.value || group.accent;
      const err = form.querySelector('.form-error');
      if (!town_name) { err.textContent = 'Give your town a name.'; err.hidden = false; return; }
      try {
        await api.updateGroup(group.id, { town_name, accent });
        sheet.close();
        toast('Town updated');
        setTimeout(() => location.reload(), 600);
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      }
    });
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
