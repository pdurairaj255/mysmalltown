<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Share a note of appreciation · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .people { border: 0; margin: 0; padding: 0; }
  .people legend { padding: 0; margin-bottom: 12px; }
  .people-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .person {
    min-height: 92px; padding: 10px 6px; border-radius: 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .person[aria-pressed="true"] { background: var(--tint); border: 2.5px solid var(--ink); }
  .person .name { font-size: 13px; font-weight: 600; line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header app-header--back">
    <a class="icon-btn" href="index.html" aria-label="Back to group">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <div class="stack stack-1">
      <h1 class="page-title page-title--sm">Today's note of appreciation</h1>
      <span class="subtitle" id="subtitle"></span>
    </div>
  </header>

  <div id="main" class="app-main"><p class="note">Loading…</p></div>
</div>
<script src="js/app.js"></script>
<script type="module">
  import { boot, api, avatar, tintOf, showError } from './js/ui.js';
  import { esc, longDate } from './js/util.js';

  const main = document.getElementById('main');
  try {
    const { group, data, me, today } = await boot();
    document.getElementById('subtitle').textContent = `${group.name} · ${longDate(today)}`;
    const mine = data.thanks.find((t) => t.author_id === me.user_id && t.day === today);

    if (mine) {
      main.innerHTML = `
        <div class="ink-card ink-card--lg">
          <h2 class="form-title">You've shared today's note of appreciation</h2>
          <p class="muted" style="font-size: 14px; line-height: 1.5">Your note to <strong style="color: var(--on-ink)">${esc(mine.recipient_name)}</strong>:</p>
          <p style="font-size: 15px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere">${esc(mine.body)}</p>
        </div>
        <p class="note center">One note of appreciation per person each day. Come back tomorrow for the next one.</p>
        <a class="btn" href="index.html">Back to ${esc(group.name)}</a>`;
    } else {
      const others = data.members.filter((m) => m.user_id !== me.user_id);
      main.outerHTML = `
        <form id="main" class="app-main app-main--loose" style="padding-top: 10px" novalidate>
          <fieldset class="people">
            <legend class="form-title">Who do you appreciate today?</legend>
            <div class="people-grid">
              ${others.map((m) => `
                <button type="button" class="person" data-id="${esc(m.user_id)}" data-name="${esc(m.name)}" aria-pressed="false" style="--tint: ${tintOf(m.avatar)}">
                  ${avatar(m, 'avatar--40')}<span class="name">${esc(m.name)}</span>
                </button>`).join('')}
              <button type="button" class="person" data-id="" data-name="" aria-pressed="false" style="--tint: var(--sun-tint)">
                <span class="avatar avatar--40 bg-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
                <span class="name">Someone else</span>
              </button>
            </div>
          </fieldset>

          <div class="field" data-when="other" hidden>
            <label class="form-title" for="who">Who was it?</label>
            <textarea class="textarea textarea--line" id="who" rows="1" maxlength="80" placeholder="A name or a short description"></textarea>
          </div>

          <div class="field">
            <label class="form-title" for="thanks-text">What did <span id="chosen">they</span> do?</label>
            <textarea class="textarea" id="thanks-text" rows="5" maxlength="1000" placeholder="Write your note of appreciation"></textarea>
          </div>

          <p class="note" data-when="other" hidden style="font-size: 14px; line-height: 1.5">Notes of appreciation for people outside the group bring visitors to your town.</p>
          <p class="form-error" role="alert" hidden></p>

          <div class="stack stack-10" style="margin-top: auto">
            <button type="submit" class="btn">Share note of appreciation</button>
            <p class="note center">One note of appreciation per person each day.</p>
          </div>
        </form>`;

      const form = document.getElementById('main');
      const people = form.querySelectorAll('.person');
      const error = form.querySelector('.form-error');
      let picked = null;

      function pick(btn) {
        picked = btn;
        people.forEach((p) => p.setAttribute('aria-pressed', p === btn ? 'true' : 'false'));
        const isOther = !btn.dataset.id;
        document.getElementById('chosen').textContent = isOther ? 'they' : btn.dataset.name;
        form.querySelectorAll('[data-when="other"]').forEach((el) => { el.hidden = !isOther; });
      }
      people.forEach((btn) => btn.addEventListener('click', () => pick(btn)));
      if (!others.length) pick(people[0]);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = document.getElementById('thanks-text').value.trim();
        const outside = document.getElementById('who').value.trim();
        const fail = (msg) => { error.textContent = msg; error.hidden = false; };
        if (!picked) return fail('Choose who you appreciate.');
        if (!picked.dataset.id && !outside) return fail('Tell us who it was.');
        if (!body) return fail('Write a few words about what they did.');
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        error.hidden = true;
        try {
          await api.shareThanks({
            group_id: group.id,
            recipient_id: picked.dataset.id || null,
            recipient_name: picked.dataset.id ? picked.dataset.name : outside,
            body,
            day: today
          });
          location.href = 'index.html';
        } catch (err) {
          fail(err.message);
          btn.disabled = false;
        }
      });
    }
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
