<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Sunday recap · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .past { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .past button { border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; }
  .past button[aria-current="true"] { font-weight: 800; }
  .past svg { width: 100%; height: auto; display: block; border-radius: 12px; border: 2px solid var(--ink); box-sizing: border-box; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="eyebrow" id="eyebrow">&nbsp;</span>
    <h1 class="page-title" id="title">Sunday recap</h1>
  </header>

  <main class="app-main app-main--tight" id="main"><p class="note">Loading…</p></main>

  <nav class="tabbar" data-current="recap"></nav>
</div>
<script src="js/app.js"></script>
<script type="module">
  import { boot, showError, toast } from './js/ui.js';
  import { renderScene, describeScene, sceneState, weekChanges } from './js/town.js';
  import { esc, shortDate } from './js/util.js';

  const main = document.getElementById('main');
  const ICON = { build: 'bg-coral', extra: 'bg-mint', visitor: 'bg-violet' };
  const lamp = '<div class="icon-tile bg-ink" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="round"><path d="M12 22V11"/><circle cx="12" cy="7" r="4" fill="#FFD23F"/></svg></div>';

  try {
    const { group, town } = await boot();
    document.getElementById('eyebrow').textContent = group.name;
    const done = town.completed;

    if (!done.length) {
      document.getElementById('title').textContent = 'Sunday recap';
      main.innerHTML = `
        <div class="scene">${renderScene(town.state, { title: describeScene(group.town_name, town.state) })}</div>
        <div class="empty">
          <span class="item-title">Your first recap arrives after Sunday</span>
          <span class="note">Each week ends on Sunday night. Then you'll see what changed in ${esc(group.town_name)}, and who made it happen.</span>
        </div>`;
    } else {
      let week = done[done.length - 1];
      let view = 'after';

      const render = () => {
        const after = sceneState(town, week);
        const before = sceneState(town, week, { before: true });
        const changes = weekChanges(town, week);
        document.getElementById('title').textContent = `Week ${week.number} in ${group.town_name}`;
        main.innerHTML = `
          <div class="segmented" role="group" aria-label="Choose which view to show">
            <button type="button" data-view="before" aria-pressed="${view === 'before'}">Before · ${shortDate(week.start)}</button>
            <button type="button" data-view="after" aria-pressed="${view === 'after'}">After · ${shortDate(week.end)}</button>
          </div>
          <div class="scene" id="scene">${view === 'before'
            ? renderScene(before, { title: describeScene(group.town_name, before) })
            : renderScene(after, { since: before, title: describeScene(group.town_name, after) + '. New things are marked with sparkles.' })}</div>

          <section class="card card--list" aria-label="What changed this week">
            ${changes.map((c) => `
              <div class="list-row">${c.kind === 'light' ? lamp : `<div class="icon-tile ${ICON[c.kind]}" aria-hidden="true"></div>`}
                <div class="stack stack-2"><span class="item-title">${esc(c.title)}</span><span class="note">${esc(c.detail)}</span></div>
              </div>`).join('')}
          </section>

          <div class="row" style="gap: 10px">
            <button type="button" class="btn btn--md" id="save">Save as image</button>
            <button type="button" class="btn btn--md btn--outline" id="send">Send to family</button>
          </div>

          ${done.length > 1 ? `
          <section class="stack stack-10" aria-label="Past Sundays">
            <h2 class="section-title">Past Sundays</h2>
            <div class="past">
              ${[...done].reverse().slice(0, 9).map((w) => `
                <button type="button" data-week="${w.index}" aria-label="Week ${w.number}, ending ${shortDate(w.end)}"${w === week ? ' aria-current="true"' : ''}>
                  ${renderScene(sceneState(town, w), { labels: false })}
                  ${shortDate(w.end)}
                </button>`).join('')}
            </div>
          </section>` : ''}`;

        main.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; render(); }));
        main.querySelectorAll('[data-week]').forEach((b) => b.addEventListener('click', () => {
          week = town.weeks[Number(b.dataset.week)];
          view = 'after';
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
        document.getElementById('save').addEventListener('click', () => saveImage(after, before));
        document.getElementById('send').addEventListener('click', () => send(changes));
      };

      // Draws the "after" scene to a PNG and shares or downloads it.
      async function saveImage(after, before) {
        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#FFD23F';
        const svg = renderScene(after, { since: before, accent }).replace('<svg ', '<svg width="1050" height="780" ');
        const img = new Image();
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        await img.decode();
        const canvas = Object.assign(document.createElement('canvas'), { width: 1050, height: 780 });
        canvas.getContext('2d').drawImage(img, 0, 0, 1050, 780);
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
        const name = `${group.town_name.replace(/[^\w-]+/g, '-')}-week-${week.number}.png`;
        const file = new File([blob], name, { type: 'image/png' });
        if (navigator.canShare?.({ files: [file] })) {
          try { await navigator.share({ files: [file], title: `${group.town_name}, week ${week.number}` }); return; } catch { /* cancelled */ }
        }
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }

      async function send(changes) {
        const text = `${group.town_name}, week ${week.number}:\n` + changes.map((c) => `• ${c.title}`).join('\n');
        const url = new URL('index.html', location.href).href;
        if (navigator.share) {
          try { await navigator.share({ title: `${group.town_name} this week`, text, url }); } catch { /* cancelled */ }
          return;
        }
        try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('Copied. Paste it into a message to your family.'); }
        catch { toast('Could not copy. Try again.'); }
      }

      render();
    }
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
