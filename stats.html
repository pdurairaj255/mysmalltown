<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .tiles { display: grid; gap: 8px; }
  .tiles--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tiles--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile { border-radius: 12px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .tile .num { font-size: 24px; }
  .tile .lbl { font-size: 12px; line-height: 1.3; }
  .ink-card .tile { background: var(--ink-raised); padding: 12px; }
  .ink-card .tile .lbl { font-size: 13px; color: var(--on-ink-muted); }
  .big-num { font-size: 52px; line-height: 1; color: var(--accent); }
  .people-table { display: flex; flex-direction: column; }
  .people-table [role="row"] { display: grid; grid-template-columns: 36px minmax(0, 1fr) 96px 48px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  .people-table .head { align-items: end; padding: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .pips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .pips div { height: 10px; border-radius: 5px; background: var(--line-soft); }
  .pips .on { border: 1.5px solid var(--ink); }
  .chart { display: grid; gap: 4px; align-items: end; height: 108px; border-bottom: 1.5px solid var(--ink); }
  .chart > div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .chart span { font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--mint); min-height: 1px; }
  .chart .last span { font-weight: 800; color: var(--ink); }
  .chart .last .bar { background: var(--coral); }
  .axis { display: grid; gap: 4px; text-align: center; font-size: 10px; color: var(--muted); }
  .axis .last { font-weight: 800; color: var(--ink); }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="eyebrow" id="eyebrow">&nbsp;</span>
    <h1 class="page-title">Stats</h1>
  </header>

  <main class="app-main" id="main"><p class="note">Loading…</p></main>

  <nav class="tabbar" data-current="stats"></nav>
</div>
<script src="js/app.js"></script>
<script type="module">
  import { boot, avatar, shirtOf, showError } from './js/ui.js';
  import { esc, addDays, shortDate } from './js/util.js';

  const main = document.getElementById('main');
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  try {
    const { group, town, data, me } = await boot();
    const week = town.current;
    document.getElementById('eyebrow').textContent = `${group.name} · ${shortDate(week.start)} – ${shortDate(week.end)}`;

    const days = Array.from({ length: 7 }, (_, i) => addDays(week.start, i));
    const sharedDays = (id) => new Set(week.thanks.filter((t) => t.author_id === id).map((t) => t.day));
    const mine = sharedDays(me.user_id);
    const myVisits = (week.visitDays.get(me.user_id) || []).length;
    const received = week.thanks.filter((t) => t.recipient_id === me.user_id).length;
    const groupVisits = [...week.visitDays.values()].reduce((n, d) => n + d.length, 0);

    const rows = data.members.map((m) => ({ ...m, posts: sharedDays(m.user_id).size, visits: (week.visitDays.get(m.user_id) || []).length }))
      .sort((a, b) => b.posts - a.posts || b.visits - a.visits);

    const recent = town.weeks.slice(-12);
    const max = Math.max(1, ...recent.map((w) => w.thanks.length));
    const cols = `grid-template-columns: repeat(${recent.length}, minmax(0, 1fr))`;

    main.innerHTML = `
      <section class="ink-card ink-card--lg" style="gap: 14px" aria-label="Your week">
        <h2 class="eyebrow" style="color: var(--on-ink-muted)">Your week</h2>
        <div class="stack stack-8">
          <div class="row" style="align-items: baseline; gap: 8px">
            <span class="num big-num">${mine.size}</span>
            <span style="font-size: 16px; font-weight: 600">of 7 thank-yous shared</span>
          </div>
          <div class="week-dots week-dots--lg" role="img" aria-label="Shared a thank-you on ${plural(mine.size, 'day')} this week">
            ${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => `<div><div class="dot${mine.has(days[i]) ? ' dot--on' : ''}"></div><span>${d}</span></div>`).join('')}
          </div>
        </div>
        <div class="tiles tiles--2">
          <div class="tile"><span class="num">${myVisits}</span><span class="lbl">${myVisits === 1 ? 'day' : 'days'} you visited</span></div>
          <div class="tile"><span class="num">${received}</span><span class="lbl">thank-you${received === 1 ? '' : 's'} for you</span></div>
        </div>
      </section>

      <section class="card card--lg" aria-label="The group this week">
        <h2 class="eyebrow">The group this week</h2>
        <div class="tiles tiles--3">
          <div class="tile bg-coral-tint"><span class="num">${week.thanks.length}</span><span class="lbl">thank-yous of ${data.members.length * 7} possible</span></div>
          <div class="tile bg-sky-tint"><span class="num">${groupVisits}</span><span class="lbl">visits</span></div>
          <div class="tile bg-violet-tint"><span class="num">${week.lit.length}</span><span class="lbl">streetlight${week.lit.length === 1 ? '' : 's'} lit</span></div>
        </div>
        <div class="people-table" role="table" aria-label="Each person's thank-yous and visits this week">
          <div role="row" class="head">
            <span role="columnheader" style="grid-column: span 2">Person</span>
            <span role="columnheader">Thank-yous</span>
            <span role="columnheader" style="text-align: right">Visits</span>
          </div>
          ${rows.map((p) => `
            <div role="row">
              ${avatar(p, 'avatar--32')}
              <span role="cell" style="font-size: 15px; font-weight: 600; min-width: 0; overflow-wrap: anywhere">${esc(p.name)}${p.user_id === me.user_id ? ' (you)' : ''}</span>
              <div role="cell" class="pips" aria-label="${p.posts} of 7 days">
                ${Array.from({ length: 7 }, (_, i) => (i < p.posts ? `<div class="on" style="background: ${shirtOf(p.avatar)}"></div>` : '<div></div>')).join('')}
              </div>
              <span role="cell" style="font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">${p.visits}</span>
            </div>`).join('')}
        </div>
        <span class="meta">Each dot is a day with a thank-you, up to one a day.</span>
      </section>

      <section class="card card--lg bg-mint-tint" aria-label="Since the start">
        <div class="stack stack-4">
          <h2 class="eyebrow" style="color: var(--forest-ink)">Since the start</h2>
          <span style="font-size: 13px; line-height: 1.45; color: var(--forest-ink)">Counting since ${shortDate(town.start)}, the week ${esc(group.town_name)} was founded.</span>
        </div>
        <div class="tiles tiles--3">
          <div class="tile bg-white"><span class="num">${data.thanks.length}</span><span class="lbl">thank-yous</span></div>
          <div class="tile bg-white"><span class="num">${data.visits.length}</span><span class="lbl">visits</span></div>
          <div class="tile bg-white"><span class="num">${town.state.pieces}</span><span class="lbl">pieces built</span></div>
        </div>
        <div class="inset bg-white" style="border-radius: 14px; padding: 14px 12px 10px">
          <span style="font-size: 13px; font-weight: 700">Thank-yous each week</span>
          <div class="chart" style="${cols}" role="img" aria-label="Group thank-yous by week, weeks ${recent[0].number} to ${week.number}: ${recent.map((w) => w.thanks.length).join(', ')}">
            ${recent.map((w, i) => `<div${i === recent.length - 1 ? ' class="last"' : ''}><span>${w.thanks.length}</span><div class="bar" style="height: ${Math.round((w.thanks.length / max) * 80)}px"></div></div>`).join('')}
          </div>
          <div class="axis" style="${cols}" aria-hidden="true">
            ${recent.map((w, i) => `<span${i === recent.length - 1 ? ' class="last"' : ''}>${w.number}</span>`).join('')}
          </div>
          <span class="center" style="font-size: 11px; color: var(--muted)">Week</span>
        </div>
      </section>`;
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
