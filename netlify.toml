# Netlify hosting for My Small Town (see SETUP.md, "Put the app online").
# The app is plain files, so there's nothing to build: publish the folder as is.

[build]
  publish = "."
  command = ""

# Every response: keep the site out of search engines and out of other sites'
# frames, and don't leak the page address to links people tap.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always check for a newer version of the app's code, so an update reaches
# everyone's phone on their next visit instead of hours later.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The admin-only database files don't need to be served to anyone.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
