<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Group home · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .town-card { background: var(--ink); color: var(--on-ink); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; }
  .town-card:hover { color: var(--on-ink); }
  .town-card > svg { display: block; width: 100%; height: auto; }
  .town-card .caption svg { flex-shrink: 0; }
  .town-card .caption { padding: 14px 18px 16px; }
  .town-card .headline { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
  .recap-banner { background: var(--pink); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: var(--ink); text-decoration: none; }
  .recap-banner .mosaic { width: 44px; height: 44px; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
  .recap-banner .mosaic div { border-radius: 4px; }
  .thanks { border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .thanks .who { margin: 0; font-size: 14px; color: var(--ink-2); min-width: 0; }
  .thanks .who strong { color: var(--ink); }
  .thanks .badge { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; background: var(--surface); border-radius: 6px; padding: 3px 7px; }
  .thanks .body-text { white-space: pre-line; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="app">
  <header class="app-header app-header--row">
    <div class="stack stack-2">
      <span class="eyebrow" id="eyebrow">Your group</span>
      <h1 class="page-title" id="title">My Small Town</h1>
    </div>
    <a class="icon-btn" href="groups.html" aria-label="Switch group" id="switch" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </a>
  </header>

  <main class="app-main" id="main" style="padding-top: 0"><p class="note">Loading…</p></main>

  <nav class="tabbar" data-current="home"></nav>
</div>
<script src="js/app.js"></script>
<script type="module">
  import { boot, avatar, tintOf, showError } from './js/ui.js';
  import { renderScene, describeScene } from './js/town.js';
  import { esc, relativeDay } from './js/util.js';

  const main = document.getElementById('main');
  try {
    const ctx = await boot({ needGroup: false });
    if (!ctx.group) {
      document.getElementById('eyebrow').textContent = `Hi, ${ctx.profile.display_name}`;
      document.getElementById('title').textContent = 'Welcome to town';
      main.innerHTML = `
        <div class="ink-card ink-card--lg">
          <h2 class="form-title">Start with your people</h2>
          <p class="muted" style="font-size: 14px; line-height: 1.5">A group is the family or friends you share notes of appreciation with. Your group gets its own town, which starts as an empty meadow and grows every week you share.</p>
        </div>
        <a class="btn" href="new-group.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Start a group
        </a>
        <a class="btn btn--outline btn--md" href="groups.html#join">I have an invite code</a>`;
    } else {
      const { group, town, data, me, today } = ctx;
      document.getElementById('title').textContent = group.name;
      document.getElementById('switch').hidden = false;
      const nameOf = (id) => data.members.find((m) => m.user_id === id);
      const latest = town.news.find((n) => n.kind === 'build') || town.news[0];
      const sharedToday = data.thanks.some((t) => t.author_id === me.user_id && t.day === today);
      const lastWeek = town.completed[town.completed.length - 1];
      const feed = [...town.current.thanks].reverse();

      main.innerHTML = `
        <a class="town-card" href="town.html" aria-label="Visit ${esc(group.town_name)}">
          ${renderScene(town.state, { viewBox: '0 30 350 230', labels: false })}
          <div class="caption row">
            <div class="stack stack-2 grow">
              <span style="font-size: 13px; color: var(--on-ink-muted)">${esc(group.town_name)} · Week ${town.current.number}</span>
              <span class="headline">${esc(town.state.pieces ? latest.text.replace(/\.$/, '') : 'An empty meadow, ready to grow')}</span>
            </div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="a-stroke" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </a>
        <p class="sr-only">${esc(describeScene(group.town_name, town.state))}</p>

        ${lastWeek ? `
        <a class="recap-banner" href="recap.html">
          <div class="mosaic" aria-hidden="true"><div class="bg-accent"></div><div class="bg-sky"></div><div class="bg-mint"></div><div class="bg-ink"></div></div>
          <div class="stack stack-1 grow">
            <span style="font-size: 16px; font-weight: 700">Sunday recap is ready</span>
            <span style="font-size: 13px">See how ${esc(group.town_name)} changed in week ${lastWeek.number}</span>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>` : ''}

        ${sharedToday
          ? `<a class="btn btn--outline" href="share.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>You shared today's note of appreciation</a>`
          : `<a class="btn" href="share.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Share today's note of appreciation</a>`}

        <section class="stack stack-12" aria-label="This week's notes of appreciation">
          <h2 class="section-title">This week's notes of appreciation</h2>
          ${feed.length ? feed.map((t) => {
            const author = nameOf(t.author_id) || { name: 'Someone' };
            return `
            <article class="thanks" style="background: ${tintOf(author.avatar)}">
              <div class="row" style="gap: 10px">
                ${avatar(author)}
                <div class="stack stack-4">
                  <p class="who"><strong>${esc(author.user_id === me.user_id ? 'You' : author.name)}</strong> appreciated <strong>${esc(t.recipient_id === me.user_id ? 'you' : t.recipient_name)}</strong> · ${relativeDay(t.day, today)}</p>
                  ${t.recipient_id ? '' : '<span class="badge">Outside the group</span>'}
                </div>
              </div>
              <p class="body-text">${esc(t.body)}</p>
            </article>`;
          }).join('') : `
            <div class="empty">
              <span class="item-title">No notes of appreciation yet this week</span>
              <span class="note">${data.members.length > 1 ? 'Be the first. Every note helps the town grow.' : `It's just you so far. Invite your family from the Groups tab, then share the first note of appreciation.`}</span>
            </div>`}
        </section>`;
    }
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
