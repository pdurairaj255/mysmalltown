<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your groups · My Small Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  .group { width: 100%; border: 0; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: var(--ink); text-align: left; cursor: pointer; font-family: var(--font-body); }
  .group[aria-current="true"] { border: 2.5px solid var(--ink); }
  .group svg { flex-shrink: 0; }
  .group .name { font-size: 16px; font-weight: 700; }
  .invite-code { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--ink-raised); border-radius: 12px; padding: 8px 8px 8px 16px; }
  .invite-code .code { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.12em; overflow-wrap: anywhere; }
  .small-btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--ink); font: 700 15px var(--font-body); cursor: pointer; flex-shrink: 0; }
  .join-row { display: flex; gap: 10px; }
  .join-row .input { flex: 1; min-width: 0; min-height: 48px; border-radius: 12px; font-weight: 500; font-size: 16px; text-transform: uppercase; letter-spacing: 0.06em; }
  .join-row .small-btn { min-height: 48px; padding: 0 20px; border-radius: 12px; background: var(--sky); }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="brand">My Small Town</span>
    <h1 class="page-title">Your groups</h1>
  </header>

  <main class="app-main app-main--loose" id="main" style="padding-top: 8px"><p class="note">Loading…</p></main>

  <nav class="tabbar" data-current="groups"></nav>
</div>
<script src="js/app.js"></script>
<script type="module">
  import { boot, api, avatar, rememberGroup, showError, toast } from './js/ui.js';
  import { esc, dayKey, daysBetween, mondayOf, shortDate } from './js/util.js';

  const main = document.getElementById('main');
  const TINTS = { '#FFD23F': 'var(--sun-tint)', '#FF7A59': 'var(--coral-tint)', '#3DD49A': 'var(--mint-tint)', '#4FB7FF': 'var(--sky-tint)' };
  const meadow = (accent) => `
    <svg width="52" height="40" viewBox="0 0 52 40" aria-hidden="true">
      <circle cx="40" cy="10" r="6" fill="${esc(accent)}" stroke="#221A47" stroke-width="1"/>
      <path d="M0 28 Q26 18 52 26 L52 40 L0 40 Z" fill="#3DD49A"/>
      <rect x="14" y="16" width="16" height="12" fill="none" stroke="#221A47" stroke-width="1.5" stroke-dasharray="3 2"/>
      <polygon points="12,17 22,9 32,17" fill="none" stroke="#221A47" stroke-width="1.5" stroke-dasharray="3 2"/>
    </svg>`;

  try {
    const { group, groups, profile, user } = await boot({ needGroup: false });
    const today = dayKey();
    const joinCode = new URLSearchParams(location.search).get('join') || '';
    const inviteUrl = group ? new URL(`groups.html?join=${encodeURIComponent(group.invite_code)}`, location.href).href : '';

    main.innerHTML = `
      ${groups.length ? `
      <section class="stack stack-10" aria-label="Groups you belong to">
        ${groups.map((g) => `
          <button type="button" class="group" data-id="${esc(g.id)}" style="background: ${TINTS[g.accent] || 'var(--surface)'}"${group && g.id === group.id ? ' aria-current="true"' : ''}>
            ${meadow(g.accent)}
            <span class="stack stack-2 grow">
              <span class="name">${esc(g.name)}</span>
              <span class="item-sub">${esc(g.town_name)} · Week ${Math.floor(daysBetween(mondayOf(dayKey(g.created_at)), today) / 7) + 1}</span>
            </span>
          </button>`).join('')}
      </section>` : ''}

      ${group ? `
      <section class="ink-card ink-card--lg" aria-label="Invite people">
        <h2 class="form-title">Invite to ${esc(group.name)}</h2>
        <p class="muted" style="font-size: 14px; line-height: 1.5">Send this link or code to anyone you'd like to add. They sign in with just their email, then join with the code.</p>
        <div class="invite-code">
          <span class="code">${esc(group.invite_code)}</span>
          <button type="button" class="small-btn" id="copy-link">${navigator.share ? 'Share link' : 'Copy link'}</button>
        </div>
      </section>` : ''}

      <form class="field" id="join" style="gap: 10px" novalidate>
        <label class="form-title" for="join-code">Join with a code</label>
        <div class="join-row">
          <input class="input" id="join-code" type="text" placeholder="Enter code" autocomplete="off" value="${esc(joinCode)}">
          <button type="submit" class="small-btn">Join</button>
        </div>
        <p class="form-error" role="alert" hidden></p>
      </form>

      <a class="btn btn--dashed" href="new-group.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Start a new group
      </a>

      <section class="card" aria-label="Your profile">
        <div class="row">
          ${avatar({ name: profile.display_name, avatar: profile.avatar })}
          <div class="stack stack-1 grow">
            <span class="item-title">${esc(profile.display_name)}</span>
            <span class="note">${esc(user.email || '')}</span>
          </div>
          <a class="pill-btn" href="signin.html?step=profile&amp;next=groups.html" style="text-decoration: none">Edit</a>
        </div>
        <button type="button" class="link-btn" id="sign-out" style="align-self: flex-start">Sign out</button>
      </section>`;

    main.querySelectorAll('.group').forEach((btn) => btn.addEventListener('click', () => {
      rememberGroup(btn.dataset.id);
      location.href = 'index.html';
    }));

    document.getElementById('copy-link')?.addEventListener('click', async () => {
      const text = `Join ${group.name} on My Small Town. Sign in with your email, then use code ${group.invite_code}.`;
      if (navigator.share) {
        try { await navigator.share({ title: `Join ${group.name}`, text, url: inviteUrl }); } catch { /* cancelled */ }
        return;
      }
      try { await navigator.clipboard.writeText(`${text}\n${inviteUrl}`); toast('Invite copied. Paste it into a message.'); }
      catch { toast(`Your code is ${group.invite_code}`); }
    });

    const joinForm = document.getElementById('join');
    joinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = joinForm.querySelector('.form-error');
      const code = document.getElementById('join-code').value.trim();
      if (!code) { err.textContent = 'Enter the code someone sent you.'; err.hidden = false; return; }
      try {
        const id = await api.joinGroup(code);
        rememberGroup(id);
        location.href = 'index.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      }
    });
    if (joinCode || location.hash === '#join') document.getElementById('join-code').focus();

    document.getElementById('sign-out').addEventListener('click', async () => {
      await api.signOut();
      location.href = 'signin.html';
    });
  } catch (e) {
    showError(main, e.message);
  }
</script>
</body>
</html>
